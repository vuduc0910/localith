[package]
name = "localith"
version = "2.0.0"
edition = "2021"
description = "Local-first website crawler and knowledge engine using agent-browser, Ollama and ChromaDB"
license = "MIT"
publish = false
rust-version = "1.82"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "fs", "signal"] }
percent-encoding = "2"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
